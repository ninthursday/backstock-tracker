<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f1117" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>BackstockTracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c26;
    --surface2: #1f2433;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f2f7;
    --muted: #7a8099;
    --accent: #4f8ef7;
    --accent-dim: rgba(79,142,247,0.15);
    --green: #3ecf8e;
    --green-dim: rgba(62,207,142,0.13);
    --amber: #f7b84f;
    --amber-dim: rgba(247,184,79,0.13);
    --red: #f7604f;
    --red-dim: rgba(247,96,79,0.13);
    --radius: 14px;
    --radius-sm: 8px;
    --tab-h: 64px;
    --header-h: 60px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: clamp(14px, 1.8vw, 16px);
    overscroll-behavior: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
  }

  /* Header */
  header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    padding: 0 clamp(16px, 3vw, 48px);
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'DM Mono', monospace;
    font-size: clamp(15px, 2vw, 18px);
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  header h1 span { color: var(--accent); }

  .header-badge {
    margin-left: auto;
    background: var(--red-dim);
    color: var(--red);
    font-size: clamp(10px, 1.2vw, 12px);
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    font-family: 'DM Mono', monospace;
    display: none;
  }

  /* Scroll area */
  #scroll-area {
    flex: 1;
    overflow-y: auto;
    padding: clamp(12px, 2vw, 28px) clamp(12px, 3vw, 48px) calc(var(--tab-h) + 16px);
    -webkit-overflow-scrolling: touch;
  }

  /* Metrics */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(8px, 1.5vw, 16px);
    margin-bottom: clamp(14px, 2.5vw, 24px);
  }

  .metric {
    background: var(--surface);
    border-radius: var(--radius);
    padding: clamp(12px, 2vw, 20px);
    border: 1px solid var(--border);
    text-align: center;
  }

  .metric-val {
    font-family: 'DM Mono', monospace;
    font-size: clamp(22px, 3.5vw, 36px);
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    margin-bottom: 5px;
  }

  .metric-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    line-height: 1.3;
  }

  /* Alert */
  .alert {
    background: var(--amber-dim);
    border: 1px solid rgba(247,184,79,0.25);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--amber);
    margin-bottom: 14px;
    display: none;
  }

  /* Section */
  .section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
    padding-left: 2px;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 20px;
    overflow: hidden;
  }

  /* Add form */
  .add-form {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .add-form input[type="text"] {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    font-size: 15px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    outline: none;
    -webkit-appearance: none;
  }

  .add-form input[type="text"]::placeholder { color: var(--muted); }
  .add-form input[type="text"]:focus { border-color: var(--accent); }

  .qty-input {
    width: 72px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 11px 10px;
    font-size: 15px;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    text-align: center;
    flex-shrink: 0;
  }

  .qty-input:focus { border-color: var(--accent); }

  .btn-add {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 0 16px;
    height: 44px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    font-family: 'DM Sans', sans-serif;
  }

  .btn-add:active { opacity: 0.8; }

  /* List items */
  .item {
    display: flex;
    align-items: center;
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }

  .item:last-child { border-bottom: none; }

  .item-name {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .item-qty {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    flex-shrink: 0;
  }

  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    flex-shrink: 0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .badge-ok { background: var(--green-dim); color: var(--green); }
  .badge-out { background: var(--red-dim); color: var(--red); }
  .badge-ready { background: var(--accent-dim); color: var(--accent); }
  .badge-needs { background: var(--amber-dim); color: var(--amber); }

  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--muted);
  }

  .icon-btn:active { background: var(--surface2); }
  .icon-btn.red { color: var(--red); border-color: rgba(247,96,79,0.25); }
  .icon-btn.green { color: var(--green); border-color: rgba(62,207,142,0.25); background: var(--green-dim); }

  /* Reorder store input row */
  .reorder-item {
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }

  .reorder-item:last-child { border-bottom: none; }

  .reorder-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .reorder-bottom {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .store-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-size: 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    outline: none;
    -webkit-appearance: none;
  }

  .store-input::placeholder { color: var(--muted); }
  .store-input:focus { border-color: var(--accent); }

  .btn-complete {
    background: var(--green);
    color: #0f1117;
    border: none;
    border-radius: var(--radius-sm);
    padding: 0 16px;
    height: 40px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    font-family: 'DM Sans', sans-serif;
    flex-shrink: 0;
  }

  .btn-complete:active { opacity: 0.8; }

  /* History items */
  .history-item {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .history-item:last-child { border-bottom: none; }

  .history-info { flex: 1; min-width: 0; }

  .history-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .history-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .history-right { text-align: right; flex-shrink: 0; }
  .history-qty { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--muted); }
  .history-date { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* Empty state */
  .empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  /* Bottom tabs */
  nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--tab-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 20;
  }

  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 0;
    position: relative;
  }

  .tab.active { color: var(--accent); }

  .tab svg { width: 22px; height: 22px; }

  .tab-dot {
    position: absolute;
    top: 10px;
    right: calc(50% - 18px);
    width: 7px;
    height: 7px;
    background: var(--red);
    border-radius: 50%;
    border: 2px solid var(--surface);
    display: none;
  }

  /* Sections visibility */
  .pane { display: none; }
  .pane.active { display: block; }

  /* Safe area */
  @supports (padding-bottom: env(safe-area-inset-bottom)) {
    nav { padding-bottom: env(safe-area-inset-bottom); height: calc(var(--tab-h) + env(safe-area-inset-bottom)); }
    #scroll-area { padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>BackstockTracker <span>//</span> Inventory</h1>
    <div class="header-badge" id="pending-badge">0 pending</div>
  </header>

  <div id="scroll-area">
    <div id="alert-box" class="alert"></div>

    <div class="metrics">
      <div class="metric">
        <div class="metric-val" id="m-stock">0</div>
        <div class="metric-label">In stock</div>
      </div>
      <div class="metric">
        <div class="metric-val" id="m-reorder">0</div>
        <div class="metric-label">To reorder</div>
      </div>
      <div class="metric">
        <div class="metric-val" id="m-history">0</div>
        <div class="metric-label">Completed</div>
      </div>
    </div>

    <!-- Backstock pane -->
    <div class="pane active" id="pane-stock">
      <div class="section-label">Backstock</div>
      <div class="card">
        <div class="add-form">
          <input type="text" id="eq-name" placeholder="Equipment name" />
          <input class="qty-input" type="number" id="qty-input" min="1" value="1" inputmode="numeric" />
          <button class="btn-add" onclick="addItem()">Add</button>
        </div>
        <div id="stock-list"></div>
      </div>
    </div>

    <!-- Reorder pane -->
    <div class="pane" id="pane-reorder">
      <div class="section-label">Reorder queue</div>
      <div class="card" id="reorder-card">
        <div id="reorder-list"></div>
      </div>
    </div>

    <!-- History pane -->
    <div class="pane" id="pane-history">
      <div class="section-label">Charge history</div>
      <div class="card">
        <div id="history-list"></div>
      </div>
    </div>
  </div>

  <nav>
    <button class="tab active" id="tab-stock" onclick="switchTab('stock')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2"/><path d="M8 7V5a2 2 0 0 0-4 0v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
      Stock
    </button>
    <button class="tab" id="tab-reorder" onclick="switchTab('reorder')">
      <div class="tab-dot" id="reorder-dot"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
      Reorder
    </button>
    <button class="tab" id="tab-history" onclick="switchTab('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      History
    </button>
  </nav>
</div>

<script>
  let inventory = JSON.parse(localStorage.getItem('inv') || '[]');
  let reorderQueue = JSON.parse(localStorage.getItem('reorder') || '[]');
  let history = JSON.parse(localStorage.getItem('history') || '[]');
  let currentTab = 'stock';

  function save() {
    localStorage.setItem('inv', JSON.stringify(inventory));
    localStorage.setItem('reorder', JSON.stringify(reorderQueue));
    localStorage.setItem('history', JSON.stringify(history));
  }

  function today() {
    return new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function switchTab(tab) {
    currentTab = tab;
    ['stock','reorder','history'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('active', t === tab);
      document.getElementById('pane-' + t).classList.toggle('active', t === tab);
    });
  }

  function addItem() {
    const nameEl = document.getElementById('eq-name');
    const qtyEl = document.getElementById('qty-input');
    const name = nameEl.value.trim();
    const qty = Math.max(1, parseInt(qtyEl.value) || 1);
    if (!name) { nameEl.focus(); return; }
    const existing = inventory.find(i => i.name.toLowerCase() === name.toLowerCase());
    if (existing) existing.qty += qty;
    else inventory.push({ name, qty });
    nameEl.value = '';
    qtyEl.value = 1;
    save();
    render();
    nameEl.focus();
  }

  function removeToReorder(idx) {
    const item = inventory[idx];
    reorderQueue.push({ name: item.name, qty: item.qty, store: '' });
    inventory.splice(idx, 1);
    save();
    render();
  }

  function completeReorder(idx) {
    const r = reorderQueue[idx];
    const storeEl = document.getElementById('store-' + idx);
    const store = storeEl ? storeEl.value.trim() : r.store.trim();
    if (!store) { if (storeEl) storeEl.focus(); return; }
    history.unshift({ name: r.name, qty: r.qty, store, date: today() });
    const existing = inventory.find(i => i.name.toLowerCase() === r.name.toLowerCase());
    if (existing) existing.qty += r.qty;
    else inventory.push({ name: r.name, qty: r.qty });
    reorderQueue.splice(idx, 1);
    save();
    render();
  }

  function updateStore(idx, val) {
    reorderQueue[idx].store = val;
  }

  function render() {
    const totalStock = inventory.reduce((a, i) => a + i.qty, 0);
    const pendingCount = reorderQueue.filter(r => !r.store.trim()).length;

    document.getElementById('m-stock').textContent = totalStock;
    document.getElementById('m-reorder').textContent = reorderQueue.length;
    document.getElementById('m-history').textContent = history.length;

    const badge = document.getElementById('pending-badge');
    if (reorderQueue.length > 0) {
      badge.style.display = 'block';
      badge.textContent = reorderQueue.length + ' to reorder';
    } else {
      badge.style.display = 'none';
    }

    const dot = document.getElementById('reorder-dot');
    dot.style.display = reorderQueue.length > 0 ? 'block' : 'none';

    const alertBox = document.getElementById('alert-box');
    if (pendingCount > 0) {
      alertBox.style.display = 'block';
      alertBox.textContent = pendingCount + ' reorder item' + (pendingCount > 1 ? 's' : '') + ' need' + (pendingCount === 1 ? 's' : '') + ' a store number.';
    } else {
      alertBox.style.display = 'none';
    }

    // Stock list
    const stockList = document.getElementById('stock-list');
    if (inventory.length === 0) {
      stockList.innerHTML = '<div class="empty">No backstock yet.<br>Add your first item above.</div>';
    } else {
      stockList.innerHTML = inventory.map((item, i) => `
        <div class="item">
          <span class="item-name">${escHtml(item.name)}</span>
          <span class="item-qty">×${item.qty}</span>
          <span class="badge ${item.qty === 0 ? 'badge-out' : 'badge-ok'}">${item.qty === 0 ? 'Out' : 'In stock'}</span>
          <button class="icon-btn red" onclick="removeToReorder(${i})" title="Deploy to reorder">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
          </button>
        </div>
      `).join('');
    }

    // Reorder list
    const reorderList = document.getElementById('reorder-list');
    if (reorderQueue.length === 0) {
      reorderList.innerHTML = '<div class="empty">No items in the reorder queue.<br>Deploy items from backstock to reorder.</div>';
    } else {
      reorderList.innerHTML = reorderQueue.map((r, i) => `
        <div class="reorder-item">
          <div class="reorder-top">
            <span class="item-name" style="font-size:14px;font-weight:500;">${escHtml(r.name)}</span>
            <span class="item-qty">×${r.qty}</span>
            <span class="badge ${r.store.trim() ? 'badge-ready' : 'badge-needs'}">${r.store.trim() ? 'Ready' : 'Needs store #'}</span>
          </div>
          <div class="reorder-bottom">
            <input class="store-input" id="store-${i}" type="text" placeholder="Store number / name" value="${escHtml(r.store)}" oninput="updateStore(${i}, this.value); rerenderBadge(${i}, this.value);" />
            <button class="btn-complete" onclick="completeReorder(${i})">Done ✓</button>
          </div>
        </div>
      `).join('');
    }

    // History list
    const historyList = document.getElementById('history-list');
    if (history.length === 0) {
      historyList.innerHTML = '<div class="empty">No completed reorders yet.</div>';
    } else {
      historyList.innerHTML = history.map(h => `
        <div class="history-item">
          <div class="history-info">
            <div class="history-name">${escHtml(h.name)}</div>
            <div class="history-meta">Charged to ${escHtml(h.store)}</div>
          </div>
          <div class="history-right">
            <div class="history-qty">×${h.qty}</div>
            <div class="history-date">${h.date}</div>
          </div>
        </div>
      `).join('');
    }
  }

  function rerenderBadge(idx, val) {
    const badges = document.querySelectorAll('.reorder-item');
    if (badges[idx]) {
      const badge = badges[idx].querySelector('.badge');
      if (badge) {
        badge.className = 'badge ' + (val.trim() ? 'badge-ready' : 'badge-needs');
        badge.textContent = val.trim() ? 'Ready' : 'Needs store #';
      }
    }
    const pendingCount = reorderQueue.filter(r => !r.store.trim()).length;
    const alertBox = document.getElementById('alert-box');
    if (pendingCount > 0) {
      alertBox.style.display = 'block';
      alertBox.textContent = pendingCount + ' reorder item' + (pendingCount > 1 ? 's' : '') + ' need' + (pendingCount === 1 ? 's' : '') + ' a store number.';
    } else {
      alertBox.style.display = 'none';
    }
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('eq-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') addItem();
  });

  render();
</script>
</body>
</html>
